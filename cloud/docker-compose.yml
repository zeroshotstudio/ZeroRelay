services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zerorelay
      POSTGRES_PASSWORD: zerorelay
      POSTGRES_DB: zerorelay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: cloud/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://zerorelay:zerorelay@postgres:5432/zerorelay
    depends_on:
      - postgres

volumes:
  pgdata:
